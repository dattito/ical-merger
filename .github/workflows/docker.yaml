name: CI and container images

on:
  workflow_dispatch:
  push:
    branches:
      - "*"
    tags:
      - "v*.*.*"
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Install Nix
        uses: cachix/install-nix-action@v31
        with:
          github_access_token: ${{ secrets.GITHUB_TOKEN }}
          extra_nix_config: |
            experimental-features = nix-command flakes
      - name: Run flake checks
        run: nix flake check --show-trace --print-build-logs

  image:
    needs: checks
    strategy:
      fail-fast: false
      matrix:
        include:
          - architecture: amd64
            runner: ubuntu-24.04
          - architecture: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
      packages: write
    env:
      ICAL_MERGER_CONFIG: |
        default_timezone = "UTC"
        [[sources]]
        url = "http://127.0.0.1:9/calendar.ics"
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Install Nix
        uses: cachix/install-nix-action@v31
        with:
          github_access_token: ${{ secrets.GITHUB_TOKEN }}
          extra_nix_config: |
            experimental-features = nix-command flakes
      - name: Build Nix container image
        run: nix build .#dockerImage --show-trace --print-build-logs
      - name: Load image
        run: docker load --input result
      - name: Smoke-test container
        run: |
          docker run --detach --name ical-merger-smoke \
            --publish 127.0.0.1:3000:3000 \
            --env "ICAL_MERGER_CONFIG=$ICAL_MERGER_CONFIG" \
            ical-merger:latest
          health_ready=false
          for _ in {1..20}; do
            if curl --fail --silent http://127.0.0.1:3000/healthz; then
              health_ready=true
              break
            fi
            sleep 1
          done
          if [ "$health_ready" != true ]; then
            docker logs ical-merger-smoke
            exit 1
          fi
          feed_status="$(curl --silent --output /dev/null --write-out '%{http_code}' http://127.0.0.1:3000/)"
          if [ "$feed_status" != 503 ]; then
            docker logs ical-merger-smoke
            exit 1
          fi
          docker logs ical-merger-smoke
      - name: Log in to GHCR
        if: startsWith(github.ref, 'refs/tags/v')
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Push architecture image
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          repository="ghcr.io/${GITHUB_REPOSITORY,,}"
          docker tag ical-merger:latest "$repository:${GITHUB_SHA}-${{ matrix.architecture }}"
          docker push "$repository:${GITHUB_SHA}-${{ matrix.architecture }}"

  publish-manifest:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: image
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    steps:
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish multi-architecture tags
        env:
          RELEASE_TAG: ${{ github.ref_name }}
          IMAGE_REPOSITORY: ghcr.io/${{ github.repository }}
        run: |
          image="${IMAGE_REPOSITORY,,}"
          version="${RELEASE_TAG#v}"
          major="${version%%.*}"
          rest="${version#*.}"
          minor="${major}.${rest%%.*}"
          docker buildx imagetools create \
            --tag "$image:$version" \
            --tag "$image:$minor" \
            --tag "$image:$major" \
            "$image:${GITHUB_SHA}-amd64" \
            "$image:${GITHUB_SHA}-arm64"
