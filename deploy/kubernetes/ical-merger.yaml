apiVersion: v1
kind: ConfigMap
metadata:
  name: ical-merger-config
data:
  config.toml: |
    listen = "0.0.0.0:3000"
    default_timezone = "Europe/Berlin"
    horizon_days = 90
    refresh_seconds = 900
    output = "busy"

    [[sources]]
    url = "https://calendar.example.net/personal.ics"

    [[sources]]
    url = "https://calendar.example.net/work.ics"
    timezone = "America/New_York"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ical-merger
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: ical-merger
  template:
    metadata:
      labels:
        app.kubernetes.io/name: ical-merger
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: ical-merger
          image: ghcr.io/dattito/ical-merger:2
          imagePullPolicy: IfNotPresent
          env:
            - name: ICAL_MERGER_CONFIG_FILE
              value: /etc/ical-merger/config.toml
          ports:
            - name: http
              containerPort: 3000
              protocol: TCP
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 2
            periodSeconds: 10
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              memory: 256Mi
          volumeMounts:
            - name: config
              mountPath: /etc/ical-merger
              readOnly: true
      volumes:
        - name: config
          configMap:
            name: ical-merger-config
---
apiVersion: v1
kind: Service
metadata:
  name: ical-merger
spec:
  selector:
    app.kubernetes.io/name: ical-merger
  ports:
    - name: http
      port: 80
      targetPort: http
      protocol: TCP
