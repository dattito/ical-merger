[package]
name = "ical-merger"
version = "2.0.0"
edition = "2021"
default-run = "ical-merger"

[[bin]]
name = "ical-merger"
path = "src/bin/http.rs"

[dependencies]
axum = "0.8.9"
chrono = "0.4"
chrono-tz = "0.10.4"
compact_str = "0.9"
futures = "0.3"
icalendar = "0.17.13"
mailrs-ical = "2.1.0"
reqwest = { version = "0.13.5", default-features = false, features = ["rustls", "http2"] }
rrule = "0.14.0"
serde = { version = "1.0", features = ["derive"] }
thiserror = "2.0"
tokio = { version = "1.47", features = ["macros", "rt-multi-thread", "net", "signal", "time", "sync"] }
toml = "0.9"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
url = { version = "2.5", features = ["serde"] }
uuid = { version = "1.18", features = ["v5"] }

[dev-dependencies]
tower = { version = "0.5", features = ["util"] }
